name: Build DemoMVC

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DemoMVC.sln

      - name: Build
        run: dotnet build DemoMVC.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test DemoMVC.sln --no-build --verbosity normal

      - name: Publish
        run: dotnet publish DemoMVC/DemoMVC.csproj -c Release -o publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemoMVC-Package
          path: publish